# Site settings. Edit the values below; restart `jekyll serve` after changes.

title: Jamaica Plain Transportation Action Group
short_title: JPTAG
description: >-
  Neighbors working for safer, more reliable transportation in Jamaica Plain.
mission: >-
  The Jamaica Plain Transportation Action Group (JPTAG) is a group of JP residents and visitors working for safer, greener, and more accessible transportation options in Jamaica Plain.

# Set to "" if the site is served from a custom domain or <user>.github.io repo.
# (The GitHub Actions build overrides this automatically.)
baseurl: ""
url: "https://jptag.org"

logo: /jptag_logo.jpg

instagram_url: https://www.instagram.com/jptransportationaction

# Link to the site's source code, shown in the footer. Set to "" to hide it.
source_url: https://github.com/nathan-weinberg/jptag

# GoatCounter site code (the "jptag" in jptag.goatcounter.com) for cookie-free page-view
# analytics. Only loaded in production builds. Set to "" to disable.
goatcounter: jptag

google_group:
  # Join/landing page for the Google Group, e.g. https://groups.google.com/g/<group-name>
  url: "https://groups.google.com/g/jptransportationaction"

calendar:
  # ID of a *public* Google Calendar (Calendar settings → Integrate calendar → Calendar ID),
  # e.g. abc123@group.calendar.google.com. No API key or credentials are needed.
  id: "3cdba8f6048c00c3949fa6dfc10b7e89473c1662e646f9613b2ec45558616bcc@group.calendar.google.com"
  timezone: America/New_York

# "Take action" button on each project with a `contact` email. It opens the visitor's mail
# client with this subject and body; {title} and {url} are replaced with the project's.
# Set label to "" to hide the buttons.
take_action:
  label: Take action
  subject: "Comments on {title}"
  body: |-
    Hello,

    I'm writing about the {title} ({url}).

    [Share your thoughts, concerns, or questions here.]

    Thank you,
    [Your name]
    [Your neighborhood or address]

nav:
  - title: Home
    url: /
  - title: Calendar
    url: /calendar/
  - title: Projects
    url: /projects/
  - title: Partners
    url: /partners/

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
