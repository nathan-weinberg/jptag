# Controls how automatically fetched projects (_data/projects_auto/) appear on the Projects page.
# Hand-written entries in _data/projects.yml are always shown and always win over fetched ones.

# Which section each source's projects go into. Either a section id, or a map of
# title regex -> section id with a `default`. A source with no routing is not shown.
routing:
  mbta:
    Columbus: columbus-ave
    default: orange-line-bus
  dcr:
    Southwest Corridor: southwest-corridor-park
    default: arborway-jamaicaway

# Fetched projects to never show (URLs). Add anything you reject in a refresh PR here,
# or it will be proposed again next week.
hide:
  - https://www.mbta.com/projects/columbus-avenue-bus-lanes
  - https://www.mbta.com/projects/ruggles-station-improvements
  - https://www.mbta.com/projects/orange-line-program
  - https://www.mbta.com/projects/fare-free-program-routes-23-28-and-29
  - https://www.mbta.com/projects/back-bay-station-improvements
  - https://www.mbta.com/projects/wellington-yard-and-maintenance-facility-updates
  - https://www.boston.gov/departments/transportation/columbus-avenue-bus-lanes
  - https://www.boston.gov/departments/transportation/hyde-park-avenue-multimodal-corridor
  - https://www.boston.gov/departments/transportation/project/roslindale-bus-lanes
  - https://www.boston.gov/departments/transportation/project/mission-hill-transportation-planning-terrace-and-parker-street
  - https://www.boston.gov/departments/transportation/project/highland-park
  - https://www.boston.gov/departments/transportation/project/ellis-safe-routes-school-project
  - https://www.boston.gov/departments/transportation/private-towingstreet-sweeping-changes
  - https://www.boston.gov/departments/transportation/jprox-transportation-action-plan
  - https://www.boston.gov/departments/transportation/southwest-corridor-crossings-project
  - https://www.boston.gov/departments/transportation/columbus-avenue-repaving
