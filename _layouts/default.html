<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip }}">
  <link rel="icon" href="{{ site.logo | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <img class="logo" src="{{ site.logo | relative_url }}" alt="" width="56" height="56">
        <span>{{ site.title }}</span>
      </a>
      {% include nav.html %}
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
      {% if site.source_url != "" %}<p><a href="{{ site.source_url }}">View the source code for this site</a></p>{% endif %}
    </div>
  </footer>
</body>
</html>
